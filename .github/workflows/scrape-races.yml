name: Scrape jogg.se races

on:
  schedule:
    - cron: "0 5 1 * *"   # 1st of each month at 05:00 UTC
  workflow_dispatch:        # Allow manual runs from GitHub UI

permissions:
  contents: read            # Read-only — only writes to Google Sheet, not the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape jogg.se and write to Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scrape_jogg.py
